  <body class="bg-slate-950 text-slate-100 font-sans antialiased selection:bg-amber-500 selection:text-black">
    <div id="root"></div>
    <script>
      // Graceful fallback for static hosting (e.g. Hostinger LiteSpeed/Apache)
      if (window.location.hostname !== 'localhost' && 
          !window.location.hostname.includes('run.app') && 
          !window.location.pathname.startsWith('/dist')) {
        window.addEventListener('error', function(e) {
          if (e.message && (e.message.indexOf('MIME type') !== -1 || e.message.indexOf('main.tsx') !== -1)) {
            console.warn('[MS PRINTERS] Redirecting to compiled production bundle...');
            window.location.replace('/dist/index.html');
          }
        }, true);
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
